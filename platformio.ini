[env:esp32c3_devkitc_02]
platform = espressif32
board = esp32-c3-devkitc-02
framework = arduino
monitor_speed = 115200
upload_speed = 460800

; La ESP32-C3-DevKitC-02 enruta el USB del conector por el bridge CP2102 a UART0.
; La USB nativa (GPIO18/19) no esta cableada al conector, por eso NO se usan
; ARDUINO_USB_MODE / ARDUINO_USB_CDC_ON_BOOT: Serial sale por UART0 -> /dev/ttyUSB*.
